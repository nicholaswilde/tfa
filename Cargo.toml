[package]
name = "tfa"
version = "0.1.9"
edition = "2021"
authors = ["Nicholas Wilde"]
description = "A CLI two-factor authentication (2FA / TOTP) application"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "serde", "qr", "steam"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
google_authenticator_converter = "0.2"
keyring = "4.2"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
rand = "0.10.3"
rpassword = "7.5.4"
url = "2.5.8"
base64ct = { version = "1.8.3", features = ["alloc"] }
rqrr = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
qrcodegen = "1.8.0"
crossterm = { version = "0.29.0", features = ["events"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
console = "0.16.6"
clap_mangen = "0.3.3"
toml = "0.8"
serde_yaml_ng = "0.10"
age = { version = "0.12.1", features = ["ssh", "armor"] }
pbkdf2 = "0.12"
sha2_v10 = { package = "sha2", version = "0.10" }
base64 = "0.22"
hex = "0.4"
scrypt = "0.11"
crypto_secretstream = "0.2"
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3.16"
rand_core = { version = "0.6", features = ["std"] }

# Profile for final production releases (smaller, faster)
[profile.release]
opt-level = "z"         # Optimize for size
lto = true              # Link Time Optimization (smaller binary)
codegen-units = 1       # Reduce parallel code generation for better optimization
panic = "abort"         # Remove stack unwinding (smaller binary)
strip = true            # Strip symbols (smaller binary)

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false     # Disable incremental compilation for CI (often slower/buggy in CI cache)
debug = 0               # No debug info needed for basic CI checks (speeds up build)
